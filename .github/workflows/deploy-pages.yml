name: Deploy GitHub Pages

# Manual trigger commit for Pages deployment.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Yoma offline validation gates
        run: npm run validate:offline:yoma

      - name: Semantic toolchain syntax check
        run: python3 -m py_compile scripts/semantic_certification.py scripts/validate_semantic_certification.py scripts/semantic_self_heal.py scripts/semantic_daf_packet.py scripts/semantic_review_state.py scripts/semantic_repair_scope_v2.py scripts/make_semantic_repair_manifest.py scripts/test_semantic_certification.py scripts/test_semantic_self_heal.py

      - name: Semantic certification safety tests
        run: |
          python3 scripts/test_semantic_certification.py
          python3 scripts/test_semantic_self_heal.py

      - name: Semantic certification status
        run: python3 scripts/validate_semantic_certification.py --module yoma --report

      - name: Rashi PR scope check
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin ${{ github.base_ref }}
          npm run check:rashi-pr-scope:yoma -- --base origin/${{ github.base_ref }}

      - name: Worker or holistic semantic scope check
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin ${{ github.base_ref }}
          if git diff --name-only origin/${{ github.base_ref }} HEAD | grep -qx '.semantic-repair-manifest.json'; then
            python3 scripts/semantic_repair_scope_v2.py --base origin/${{ github.base_ref }}
          else
            python3 scripts/worker_pipeline.py ci-check --base origin/${{ github.base_ref }}
          fi

      - name: Semantic certification ratchet
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin ${{ github.base_ref }}
          python3 scripts/validate_semantic_certification.py --module yoma --ratchet --base origin/${{ github.base_ref }}

      - name: Build production site
        # Explicit module selection (Phase 3 Step 4A): GitHub Pages must
        # deploy Yoma and nothing else, even after a second module exists
        # under modules/. This is a code-level guard, not "true by absence
        # of alternatives" - build.mjs also refuses to build any
        # non-publishable module into dist/ at all (see scripts/build.mjs).
        run: npm run build -- --module yoma

      - name: Verify deployable HTML
        run: npm run check:deploy-html

      - name: Run smoke test
        run: npm test

      - name: Run browser smoke test
        run: npm run test:browser

      - name: Run fixture onboarding proof
        # Phase 3 row 34: the fixture-onboarding proof (Step 6) was
        # previously only run manually/on-demand. Wiring it into the
        # required build check means the platform's module-agnostic
        # resolver/build/render chain is actually enforced on every PR,
        # not just proven once and left to bit-rot.
        run: npm run test:fixture-onboarding

      - name: Run module scaffold proof
        # Phase 3 row 23: proves a module can be produced from an empty
        # directory and pass through the same generic chain, not just
        # that the already-committed fixture resolves correctly.
        run: npm run test:module-scaffold

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload dist artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
      deployments: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Cancel stale Pages deployments
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment: 'github-pages',
                per_page: 10
              });
              for (const d of deployments) {
                if (d.sha === context.sha) {
                  console.log(`Skipping current deployment ${d.id} (${d.sha.slice(0,7)})`);
                  continue;
                }
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: d.id,
                  per_page: 1
                });
                const state = statuses[0]?.state;
                if (!state || ['pending', 'queued', 'in_progress'].includes(state)) {
                  console.log(`Setting stale deployment ${d.id} (${d.sha.slice(0,7)}) to inactive`);
                  await github.rest.repos.createDeploymentStatus({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    deployment_id: d.id,
                    state: 'inactive',
                    description: 'Superseded by a newer Pages deployment run'
                  });
                }
              }
            } catch (e) {
              console.log('Could not clear stale deployments:', e.message);
            }

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
